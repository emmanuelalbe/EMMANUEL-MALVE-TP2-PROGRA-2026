<article class="pub-tarjeta premium-panel premium-panel--interactive">
  <a class="pub-tarjeta__media" [routerLink]="['/publicaciones', publicacion._id]">
    @if (tieneImagen) {
      <img
        class="pub-tarjeta__imagen"
        [src]="imagenUrl()"
        [alt]="publicacion.titulo"
        loading="lazy"
        (error)="ocultarImagenRota()"
      />
    } @else {
      <div class="pub-tarjeta__sin-imagen">
        <svg class="premium-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 16l4.5-4.5a2 2 0 0 1 2.8 0L16 16M14 14l1.5-1.5a2 2 0 0 1 2.8 0L21 16M3 6h18v14H3V6Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    }
    <span class="pub-tarjeta__overlay"></span>
  </a>

  <div class="pub-tarjeta__body">
    <h3 class="pub-tarjeta__titulo">
      <a [routerLink]="['/publicaciones', publicacion._id]">{{ publicacion.titulo }}</a>
    </h3>

    <p class="pub-tarjeta__descripcion">{{ descripcionCorta() }}</p>

    <div class="pub-tarjeta__meta">
      <span class="pub-tarjeta__fecha">
        <svg class="premium-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        {{ publicacion.fechaCreacion | date: 'mediumDate' }}
      </span>

      <div class="pub-tarjeta__stats">
        <span class="pub-tarjeta__stat">
          <svg class="premium-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 20.5s-6.5-4.2-6.5-9a4 4 0 0 1 7-2.4A4 4 0 0 1 19.5 11.5c0 4.8-6.5 9-7.5 9Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
          {{ publicacion.cantidadMeGusta }}
        </span>
        <span class="pub-tarjeta__stat">
          <svg class="premium-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 5.5h16v11H7.5L4 19.5V5.5Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
          {{ cantidadComentarios() }}
        </span>
      </div>
    </div>
  </div>
</article>
